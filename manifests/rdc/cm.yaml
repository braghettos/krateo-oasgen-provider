apiVersion: v1
data:
  configmap.yaml: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .name }}-configmap
      namespace: {{ .namespace }}
    data:
      REST_CONTROLLER_SERVICEACCOUNT_NAME: {{ .composition_controller_sa_name }}
      REST_CONTROLLER_SERVICEACCOUNT_NAMESPACE: {{ .composition_controller_sa_namespace }}
      HOME: /tmp # home should be set to /tmp or any other writable directory to avoid permission issues with helm https://github.com/helm/helm/issues/8038
kind: ConfigMap
metadata:
  name: rdc-configmap
  namespace: demo-system

