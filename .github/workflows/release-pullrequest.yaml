name: release-pullrequest

on:
  pull_request:
    branches:
      - main

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and Push
    strategy:
      matrix:
        mod: [oasgen-provider, rest-dynamic-controller]
        runner: [ubuntu-22.04-arm, ubuntu-22.04]
        include:
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
          - runner: ubuntu-22.04
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.mod }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and NOT push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: go/${{ matrix.mod }}
          file: go/${{ matrix.mod }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}

  # The suite itself lives in test.yaml, the single definition shared with the push-to-main trigger
  # and with release-tag.yaml's release gate — so the three cannot drift apart.
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  crds-drift:
    name: CRDs drift guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/oasgen-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/oasgen-provider/go.mod
      - name: Regenerate CRDs
        run: go generate ./apis/...
      - name: Fail if committed CRDs are out of date
        run: |
          if ! git diff --exit-code crds/; then
            echo "::error::crds/ is out of date. Run 'go generate ./apis/...' and commit the result." >&2
            exit 1
          fi
