# Default values for oasgen-provider.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Global values shared across (sub)charts. imageRegistry, when set, relocates the HOST of every
# container image (repository paths preserved); leave empty to use each image's own registry.
global:
  imageRegistry: ""

image:
  registry: ghcr.io
  repository: krateo-platformops/oasgen-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "oasgen-provider"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir: {}
    name: tmp-dir

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /tmp
    name: tmp-dir

nodeSelector: {}

tolerations: []

affinity: {}

rdc:
  image:
    registry: ghcr.io
    repository: krateo-platformops/rest-dynamic-controller
    pullPolicy: IfNotPresent
    # NOTE: hand-maintained. The release workflow's APP_VERSION substitution applies to
    # Chart.yaml only, never to values.yaml, so this tag does NOT auto-track RDC releases —
    # bump it here whenever a new rest-dynamic-controller version should ship with the chart.
    # Must be >= 0.12.0, which is when RDC began requiring the SA-identity env vars that
    # assets/rdc/configmap.yaml supplies (REST_CONTROLLER_SERVICEACCOUNT_NAME/_NAMESPACE).
    #
    # 0.19.0 is pinned because this chart ships oasgen 0.19.0, whose apiKey-in-header support
    # (#49) is a JOINT contract: oasgen generates an `authentication.apiKey` block in the
    # Configuration CRD, RDC reads the header name and optional valuePrefix out of it and
    # sends the credential. This pairing differs from the ones below in ONE respect worth
    # knowing: an older RDC fails LOUDLY here — auth.ToType returns "unknown auth type:
    # apiKey" and the reconcile errors — rather than silently doing the wrong thing. The pin
    # still moves, so the feature works out of the box instead of erroring on first use.
    #
    # 0.18.0 was pinned because this chart shipped oasgen 0.18.0, and two of that release's
    # features are a JOINT contract: oasgen accepts and validates them, RDC executes them.
    # An older RDC does not reject such a RestDefinition — it ignores the field and does
    # the wrong thing silently, which is the failure mode this pin exists to prevent.
    #
    #   * async.poll.handleParam (oasgen #46): names the path parameter the extracted
    #     operation handle binds to, so a poll endpoint the vendor declares as
    #     .../monitor/{id} works without patching the OAS document. RDC < 0.18.0 ignores
    #     handleParam and binds to "operationId", so the poll path never resolves and the
    #     resource never leaves Pending — after the create has already fired.
    #   * spec forwarding on every *ApiRef direction (RDC #41): a delegated delete now
    #     receives the CR spec, like create/update. On an older RDC it receives none, so a
    #     teardown RESTAction reading .spec.* sees nulls, skips every step, reports success,
    #     and the finalizer is never released — the CR hangs in Deleting forever.
    #
    # 0.17.0 additionally gives requestTransform a call site (it is applied to the outgoing
    # body); before that oasgen rejected the field at admission precisely because nothing
    # ran it. Carried forward from the previous pin: [?key=value] array predicates in
    # fieldMapping paths (0.16.0), which address an array element by content instead of by
    # position, and the fix for a CR whose create failed being undeletable (0.16.1).
    #
    # No chart-side change accompanies this bump: 0.16.1 -> 0.19.0 touches controller
    # internals and CI only — no new flags, env vars or RBAC (verified against main.go and
    # the tag-to-tag diff).
    tag: 0.19.0
  replicaCount: 1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  env: {}
env:
  OASGEN_PROVIDER_DEBUG: "false"
  OASGEN_PROVIDER_MAX_RECONCILE_RATE: 1
